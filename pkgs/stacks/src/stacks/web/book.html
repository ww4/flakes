<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>stacks — book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <span class="dot ready"></span>
  <h1 id="page-title">Book</h1>
  <nav class="tabs">
    <a href="./">Scan</a>
    <a href="browse.html">Browse</a>
    <a href="cleanup.html">Cleanup</a>
    <a href="logs.html">Logs</a>
  </nav>
</header>

<main>
  <section class="card show" id="card">
    <div class="card-head">
      <img class="card-cover" id="c-cover" alt="" hidden>
      <div style="flex:1; min-width:0">
        <h2 class="card-title" id="c-title"></h2>
        <p class="card-by" id="c-by"></p>
      </div>
    </div>
    <p class="rec" id="c-rec"></p>
    <p class="ednote" id="c-ednote" hidden></p>
    <ul class="facts" id="c-facts"></ul>
    <p class="desc" id="c-desc"></p>
    <div class="card-actions" id="c-actions">
      <button class="primary" id="btn-have">✓ I have this</button>
      <button id="btn-another">+ Another copy</button>
    </div>
    <div id="c-copies"></div>
    <div id="c-editions"></div>
    <p class="meta" id="c-meta"></p>
    <div id="c-edit" hidden></div>
  </section>
  <p class="note" id="loading">Loading…</p>
</main>

<script src="card.js"></script>
<script src="edit.js"></script>
<script src="book.js"></script>
</body>
</html>
