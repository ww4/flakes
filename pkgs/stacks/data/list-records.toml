# Loss-document lines that name several books instead of one.
#
# The document was written by hand under the worst possible circumstances, and
# some lines are lists: "Cam janson had: corn popper, camp mystery, it's a
# raid, ...". The parser turned each of those into a single work with a
# 200-character title, which is not a book and can never be scanned, matched or
# replaced. Every one of them is a record of several real books that were lost.
#
# This file is the human judgement — which line names which books — kept
# separate from the code that applies it, versioned and reviewable. The
# fragments are copied VERBATIM from the document. They are deliberately not
# expanded into full titles here: the catalog already holds 12 Cam Jansen
# works and 11 Boxcar Children from the Libib export, so the importer resolves
# each fragment against what is already known and attaches the loss to the real
# book. Guessing full titles by hand would invent records; matching finds them.
#
# Each child copy inherits the parent's status and provenance, which the flood
# importer already got right:
#   "had:"  -> lost_flood      (what was destroyed)
#   "have:" -> unverified      (replacements acquired, still unconfirmed)
#
# `volumes` is for lines that list volume NUMBERS rather than titles. Those are
# recorded as numbered entries and left for a later pass: Open Library cannot
# resolve a series number reliably (searching "Magic Tree House 17" returns
# #27's title first), and inventing the titles would be worse than recording
# the true fact that volume 17 was lost.

# ------------------------------------------------------------------ titles
[[record]]
work_id = 2900
series = "Cam Jansen"
fragments = [
    "Mystery of the U.F.O",
    "Mystery of the Gold Coins",
    "Mystery of the Stolen Corn Popper",
]

