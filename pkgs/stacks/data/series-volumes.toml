# Series volume numbers resolved to the titles they name.
#
# The loss document records two series by number rather than title — "Magic
# tree house had:1,2,4,5,..." and "Boxcar children had:1,2,3,...". Those became
# placeholder works ("Magic Tree House #17") because a number is a true record
# and an invented title is not.
#
# Open Library cannot resolve them. Searching "Magic Tree House 17" returns
# #27's title first, and the series strings on its edition records disagree
# across translations and boxed sets — a sample of six scored two confidently
# WRONG, both claiming #1. At a sale that error puts the wrong book on the
# replace list, which is worse than a number.
#
# So these come from Wikipedia's series tables, then every one was checked
# against Open Library independently: all 34 confirmed. Anchors were verified
# by hand too, which is how a first pass got caught reading the wrong table on
# the page and returning the Benny-and-Watch early readers as the novels.
#
# NOT resolved, deliberately: Magic Tree House 29, 30, 34, 40 and 48. That
# series was renumbered — Merlin Missions were originally 29-55 and were later
# split into their own 1-27 — so a number above 28 names two different books
# depending on which printing the list was written from. 1-28 is identical in
# both schemes, so those are safe. The rest need Chris.


