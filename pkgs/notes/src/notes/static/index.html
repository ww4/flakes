<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
mark{background:var(--mark-bg); color:var(--mark-ink); border-radius:2px; padding:0 1px}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --ground:#eef1f0; --surface:#fdfdfc; --surface-2:#e7ebe9;
  --ink:#16211f; --ink-soft:#5a6a66; --ink-faint:#8697924d;
  --line:#d5dcd9; --line-strong:#bfc9c5;
  --accent:#136b63; --accent-ink:#ffffff; --accent-wash:#136b6314;
  --brass:#8d620f; --brass-wash:#8d620f17;
  --mark-bg:#f8e3a4; --mark-ink:#2b2005;
  --shadow:0 1px 2px #16211f0f, 0 0 0 1px #16211f0a;
  --shadow-lift:0 4px 14px #16211f1f, 0 0 0 1px #16211f14;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101514; --surface:#19201e; --surface-2:#222a28;
    --ink:#e4e9e7; --ink-soft:#93a19d; --ink-faint:#93a19d3d;
    --line:#2a3331; --line-strong:#3a4542;
    --accent:#55b9ad; --accent-ink:#07211f; --accent-wash:#55b9ad1f;
    --brass:#d4a13f; --brass-wash:#d4a13f1f;
    --mark-bg:#6d5518; --mark-ink:#f8ecd0;
    --shadow:0 1px 2px #0006, 0 0 0 1px #ffffff0d;
    --shadow-lift:0 6px 18px #0008, 0 0 0 1px #ffffff14;
  }
}
:root[data-theme="dark"]{
  --ground:#101514; --surface:#19201e; --surface-2:#222a28;
  --ink:#e4e9e7; --ink-soft:#93a19d; --ink-faint:#93a19d3d;
  --line:#2a3331; --line-strong:#3a4542;
  --accent:#55b9ad; --accent-ink:#07211f; --accent-wash:#55b9ad1f;
  --brass:#d4a13f; --brass-wash:#d4a13f1f;
  --mark-bg:#6d5518; --mark-ink:#f8ecd0;
  --shadow:0 1px 2px #0006, 0 0 0 1px #ffffff0d;
  --shadow-lift:0 6px 18px #0008, 0 0 0 1px #ffffff14;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- chrome ---------- */
.bar{
  position:sticky; top:0; z-index:20; background:var(--ground);
  border-bottom:1px solid var(--line);
  padding:10px 14px 0;
}
.bar-row{display:flex; align-items:center; gap:10px; max-width:1280px; margin:0 auto}
.brand{
  font:700 17px/1 Archivo,"Archivo",system-ui,sans-serif; letter-spacing:-.01em;
  display:flex; align-items:baseline; gap:8px; flex:none;
}
.brand b{color:var(--accent)}
.count{font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft); letter-spacing:.06em}
.search{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:0 12px; height:38px; box-shadow:var(--shadow);
}
.search svg{flex:none; color:var(--ink-soft)}
.search input{
  flex:1; min-width:0; border:0; background:none; color:var(--ink);
  font:400 15px/1 "IBM Plex Sans",system-ui,sans-serif; outline:none; height:100%;
}
.search input::placeholder{color:var(--ink-soft)}
.iconbtn{
  flex:none; display:grid; place-items:center; width:38px; height:38px;
  border:1px solid var(--line); border-radius:999px; background:var(--surface);
  color:var(--ink-soft); cursor:pointer; box-shadow:var(--shadow);
}
.iconbtn:hover{color:var(--ink); border-color:var(--line-strong)}
.iconbtn[aria-pressed="true"]{background:var(--accent-wash); border-color:var(--accent); color:var(--accent)}

.filters{display:flex; gap:10px; align-items:center; max-width:1280px; margin:0 auto; padding:10px 0}
.seg{flex:none; display:flex; border:1px solid var(--line); border-radius:999px; background:var(--surface); overflow:hidden}
.seg button{
  border:0; background:none; cursor:pointer; color:var(--ink-soft);
  padding:6px 12px; font:500 11px/1.3 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
}
.seg button + button{border-left:1px solid var(--line)}
.filters::before{content:none}
.filters .chips{border-left:1px solid var(--line); padding-left:10px}
.seg button:hover{color:var(--ink); background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
/* No scrollbar: show the categories that fit and drop the rest. Search is the
   way to reach the long tail. */
.chips{display:flex; gap:6px; min-width:0; flex:1 1 auto; overflow:hidden; flex-wrap:nowrap}
.chip{
  flex:none; cursor:pointer; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-soft); border-radius:999px; padding:5px 11px;
  font:500 11px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
  text-transform:uppercase; white-space:nowrap;
}
.chip b{font-weight:500; color:var(--ink-faint); margin-left:5px}
.chip:hover{border-color:var(--line-strong); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--ground)}
.chip[aria-pressed="true"] b{color:var(--ground); opacity:.55}

/* ---------- wall ---------- */
main{max-width:1280px; margin:0 auto; padding:18px 14px 96px}
.eyebrow{
  display:flex; align-items:center; gap:9px; margin:4px 0 12px;
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.eyebrow::after{content:""; flex:1; height:1px; background:var(--line)}
.eyebrow.brass{color:var(--brass)}
/* Columns are built in JS, not by CSS multicol. Multicol fills column 1 top to
   bottom before starting column 2, so on a newest-first wall the third column
   showed 2016 beside 2026 — reading ACROSS a row was meaningless. Cards are
   now dealt round-robin into these columns, so row 1 is the four newest. */
.wall{display:flex; align-items:flex-start; gap:14px}
.col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:14px}
.section{margin-bottom:26px}

.card{
  break-inside:avoid; -webkit-column-break-inside:avoid;
  background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow);
  margin:0; padding:13px 14px 10px; cursor:pointer; position:relative;
  transition:box-shadow .14s ease, transform .14s ease;
}
.card:hover{box-shadow:var(--shadow-lift)}
.card:active{transform:scale(.995)}
.card.pending{box-shadow:var(--shadow), inset 3px 0 0 var(--mark-bg); opacity:.92}
.card.pending .meta .cat{color:var(--brass)}
.card.pinned{box-shadow:var(--shadow), inset 3px 0 0 var(--brass)}
.card.pinned:hover{box-shadow:var(--shadow-lift), inset 3px 0 0 var(--brass)}
.card h3{
  margin:0 26px 7px 0;
  font:600 15px/1.3 Archivo,system-ui,sans-serif; letter-spacing:-.005em;
  text-wrap:balance;
}
.body{position:relative; max-height:184px; overflow:hidden}
.body.clipped::after{
  content:""; position:absolute; inset:auto 0 0; height:40px;
  background:linear-gradient(to bottom, transparent, var(--surface));
}
.body p{margin:0 0 5px; white-space:pre-wrap; overflow-wrap:break-word}
.body strong{font-weight:600}
.body code{font:400 .92em/1.4 "IBM Plex Mono",ui-monospace,monospace; background:var(--surface-2); border-radius:4px; padding:1px 4px}
@media (max-width:720px){.count{display:none}}
.body .h{margin:9px 0 4px; font:600 11px/1.3 Archivo,system-ui,sans-serif;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
.body .li{display:flex; gap:7px; margin:0 0 3px; align-items:flex-start}
.body .li > span{flex:1; min-width:0; overflow-wrap:break-word}
.body .li::before{content:"\2022"; color:var(--ink-faint); line-height:1.5}
.body .ck{display:flex; gap:8px; margin:0 0 4px; align-items:flex-start}
.body .ck span{flex:1; overflow-wrap:break-word}
.body .ck.done span{color:var(--ink-soft); text-decoration:line-through}
.box{
  flex:none; width:15px; height:15px; margin-top:2px; border-radius:3px;
  border:1.5px solid var(--line-strong); background:none; cursor:pointer;
  display:grid; place-items:center; color:var(--accent-ink); padding:0;
}
.box.on{background:var(--accent); border-color:var(--accent)}
.more{
  font:500 10px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft);
  letter-spacing:.05em; margin:6px 0 0;
}
.meta{
  display:flex; align-items:center; gap:8px; margin-top:9px;
  padding-top:8px; border-top:1px solid var(--line);
  font:400 10px/1 "IBM Plex Mono",ui-monospace,monospace; color:var(--ink-soft);
  letter-spacing:.04em;
}
.meta .cat{color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-weight:500}
.meta .sp{flex:1}
.meta .yr{font-variant-numeric:tabular-nums}
.pin{
  position:absolute; top:9px; right:8px; width:26px; height:26px; padding:0;
  display:grid; place-items:center; border:0; border-radius:7px;
  background:none; color:var(--ink-faint); cursor:pointer;
}
.card:hover .pin, .card.pinned .pin{color:var(--ink-soft)}
.pin:hover{background:var(--surface-2); color:var(--ink)}
.card.pinned .pin{color:var(--brass)}

/* search suggestions */
.sug{
  position:absolute; left:0; right:0; top:100%; z-index:30; margin-top:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-lift); overflow:hidden; max-height:60vh; overflow-y:auto;
}
.sug[hidden]{display:none}
.sug-head{
  padding:8px 13px 5px; font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
}
.sug button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer; color:var(--ink);
  padding:9px 13px; font:400 14px/1.3 "IBM Plex Sans",system-ui,sans-serif;
}
.sug button:hover, .sug button:focus-visible{background:var(--surface-2); outline:none}
.sug .tag{
  flex:none; font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.08em; text-transform:uppercase; color:var(--accent);
  border:1px solid var(--accent); border-radius:999px; padding:3px 7px;
}
.sug .n{margin-left:auto; color:var(--ink-faint); font:400 10px/1 "IBM Plex Mono",monospace}
.sug .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.search-wrap{position:relative; flex:1 1 auto; min-width:0; display:flex}

/* category chooser: an icon on the editor's bottom row, popping a panel that
   both lists what exists and accepts a new name */
.ed-bar{position:relative}
.catpop{
  position:absolute; left:8px; bottom:calc(100% + 6px); z-index:50; width:min(290px, calc(100vw - 32px));
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow-lift); overflow:hidden;
}
.catpop[hidden]{display:none}
.catpop input{
  width:100%; border:0; border-bottom:1px solid var(--line); background:none;
  color:var(--ink); padding:11px 13px; outline:none;
  font:500 12px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
}
.catpop input:focus{border-bottom-color:var(--accent)}
.catlist{max-height:240px; overflow-y:auto}
.catlist button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  border:0; background:none; cursor:pointer; color:var(--ink); padding:8px 13px;
  font:500 11.5px/1.3 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.04em;
  text-transform:uppercase;
}
.catlist button:hover, .catlist button:focus-visible{background:var(--surface-2); outline:none}
.catlist button[aria-pressed="true"]{color:var(--accent)}
.catlist button .n{margin-left:auto; color:var(--ink-faint); text-transform:none}
.catlist .new{color:var(--accent)}
.cat-now{
  font:500 9.5px/1 "IBM Plex Mono",ui-monospace,monospace; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-soft); padding-left:2px;
}

/* who is on this device */
.me-btn{
  flex:none; width:30px; height:30px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:600 12px/1 Archivo,system-ui,sans-serif; letter-spacing:.02em;
  display:grid; place-items:center;
}
.me-btn:hover{border-color:var(--accent); color:var(--accent)}
.me-btn.unset{border-style:dashed; color:var(--ink-soft)}
.whobar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  max-width:1280px; margin:0 auto; padding:0 0 10px;
}
.whobar[hidden]{display:none}
.whobar span{
  font:500 10px/1.6 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
}
.whobar button{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:999px; padding:5px 13px; cursor:pointer;
  font:500 11px/1.3 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.05em; text-transform:uppercase;
}
.whobar button:hover{border-color:var(--accent); color:var(--accent)}
.meta .by{color:var(--brass); text-transform:uppercase; letter-spacing:.08em; font-weight:500}

/* online / offline */
.net{
  flex:none; display:grid; place-items:center; width:30px; height:30px;
  border-radius:999px; color:var(--ink-soft);
}
.net.off{color:var(--brass); background:var(--brass-wash)}
.more-btn{
  display:block; width:100%; margin:4px 0 18px; padding:13px 16px;
  border:1px dashed var(--line-strong); border-radius:var(--r);
  background:none; color:var(--ink-soft); cursor:pointer;
  font:500 11px/1 "IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.08em; text-transform:uppercase;
}
.more-btn:hover{border-color:var(--accent); color:var(--accent)}
.empty{
  text-align:center; padding:56px 20px; color:var(--ink-soft);
  font:400 14px/1.6 "IBM Plex Sans",system-ui,sans-serif;
}
.empty code{font:400 13px/1 "IBM Plex Mono",monospace; background:var(--surface-2); padding:2px 5px; border-radius:4px}

/* ---------- fab ---------- */
.fab{
  position:fixed; right:18px; bottom:18px; z-index:30;
  height:52px; padding:0 20px 0 17px; display:flex; align-items:center; gap:9px;
  border:0; border-radius:999px; background:var(--accent); color:var(--accent-ink);
  font:600 14px/1 Archivo,system-ui,sans-serif; cursor:pointer;
  box-shadow:0 5px 16px #16211f33;
}
.fab:hover{filter:brightness(1.07)}

/* ---------- editor: the card, expanded ---------- */
.scrim{
  position:fixed; inset:0; z-index:40; background:#0b100fa6;
  display:flex; align-items:center; justify-content:center;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.scrim[hidden]{display:none}
@media (min-width:700px){.scrim{padding:30px}}
.sheet{
  background:var(--surface); width:100%; height:100%;
  display:flex; flex-direction:column; box-shadow:0 10px 50px #00000059;
}
@media (min-width:700px){
  .sheet{max-width:620px; height:auto; max-height:88vh; border-radius:14px}
}
.ed-top{display:flex; align-items:center; gap:4px; padding:8px 8px 4px; flex:none}
.ed-top input{
  flex:1; min-width:0; border:0; background:none; color:var(--ink);
  font:600 18px/1.35 Archivo,system-ui,sans-serif; outline:none; padding:6px 6px;
}
.ed-top input::placeholder{color:var(--ink-faint)}
.ed-scroll{flex:1; overflow-y:auto; padding:2px 12px 10px; -webkit-overflow-scrolling:touch}

/* uniform editable row */
.row{display:flex; align-items:flex-start; gap:8px; border-radius:7px; padding:1px 2px}
.row:focus-within{background:var(--accent-wash)}
.row .grip{
  flex:none; width:16px; align-self:center; color:var(--ink-faint);
  display:grid; place-items:center; cursor:grab;
}
@media (max-width:700px){.row .grip{display:none}}
.row .it{resize:none; overflow:hidden;
  flex:1; min-width:0; border:0; background:none; color:var(--ink); outline:none;
  font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif; padding:4px 0;
}
.row.note .it{color:var(--ink-soft); font-style:italic}
.row.done .it{color:var(--ink-soft); text-decoration:line-through}
.row.sec .it{
  font:600 11px/1.5 Archivo,system-ui,sans-serif; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-soft); padding-top:12px;
}
.row .x{
  flex:none; width:26px; height:26px; align-self:center; padding:0; border:0;
  background:none; color:var(--ink-faint); border-radius:6px; cursor:pointer;
  display:grid; place-items:center; opacity:0;
}
.row:hover .x, .row:focus-within .x{opacity:1}
@media (pointer:coarse){.row .x{opacity:.55}}
.row .x:hover{background:var(--surface-2); color:var(--ink)}
.row .box{margin-top:7px}

.add{
  display:flex; align-items:center; gap:8px; padding:5px 2px; margin-left:24px;
  background:none; border:0; cursor:pointer; color:var(--ink-soft);
  font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif; width:calc(100% - 24px);
  text-align:left; border-radius:7px;
}
.add:hover{color:var(--ink); background:var(--surface-2)}
.ed-raw{
  width:100%; min-height:300px; resize:vertical; border:1px solid var(--line);
  border-radius:8px; background:var(--ground); color:var(--ink); padding:11px 12px;
  outline:none; font:400 13.5px/1.7 "IBM Plex Mono",ui-monospace,monospace; tab-size:2;
}
.ed-raw:focus{border-color:var(--accent)}

/* bottom toolbar */
.ed-bar{
  flex:none; display:flex; align-items:center; gap:2px; padding:7px 9px;
  border-top:1px solid var(--line);
}
.tool{
  width:36px; height:36px; display:grid; place-items:center; padding:0;
  border:0; border-radius:8px; background:none; color:var(--ink-soft); cursor:pointer;
}
.tool:hover{background:var(--surface-2); color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent)}
.tool.brass[aria-pressed="true"]{background:var(--brass-wash); color:var(--brass)}
.ed-bar .sp{flex:1}
.saved{
  font:400 10px/1 "IBM Plex Mono",ui-monospace,monospace;
  color:var(--ink-soft); letter-spacing:.04em; padding-right:6px;
}
.ed-path{
  padding:2px 14px 9px; font:400 10px/1.5 "IBM Plex Mono",ui-monospace,monospace;
  color:var(--ink-faint); overflow-wrap:anywhere; flex:none;
}

/* undo toast */
.toast{
  position:fixed; left:16px; bottom:18px; z-index:60; display:flex; align-items:center; gap:14px;
  background:var(--ink); color:var(--ground); border-radius:9px; padding:11px 12px 11px 15px;
  box-shadow:0 6px 22px #00000040;
  font:400 13px/1 "IBM Plex Sans",system-ui,sans-serif;
}
.toast[hidden]{display:none}
.toast button{
  border:0; background:none; color:var(--accent); cursor:pointer;
  font:600 13px/1 Archivo,system-ui,sans-serif; letter-spacing:.04em; text-transform:uppercase;
}

</style>
</head>
<body>

<div class="bar">
  <div class="bar-row">
    <div class="brand">Notes <span class="count" id="count"></span></div>
    <div class="search-wrap">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search notes and categories" aria-label="Search notes and categories"
               autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sug"
               title="Type words to search, or cat:woodgas to filter to a category">
      </label>
      <div class="sug" id="sug" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <span class="net" id="net" title="Online" aria-live="polite"></span>
    <button class="me-btn unset" id="meBtn" title="Who's using this device?" aria-label="Who's using this device?">?</button>
    <button class="iconbtn" id="archBtn" aria-pressed="false" title="Show archive" aria-label="Show archive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7h18v3H3zM5 10v10h14V10M9.5 14h5"/></svg>
    </button>
  </div>
  <div class="whobar" id="whobar" hidden></div>
  <div class="filters">
    <div class="seg" id="who" role="group" aria-label="Whose notes"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <div id="wall"></div>
</main>


<button class="fab" id="newBtn">

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function(){
  "use strict";
  // ---- state: the server is the state. No localStorage, no client cache to
  // go stale against four other writers of this space (SilverBullet, the
  // daybook, the agent, a git restore). Every mutation is a request; the
  // reply is what we render.
  var NOTES = [], CATS = {}, AUTHORS = {}, ME = null;

  function api(method, url, body){
    return fetch(url, {
      method: method,
      headers: body ? {"Content-Type":"application/json"} : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      setNet(true);                       // the box answered, whatever it said
      if (!r.ok) {
        return r.json().catch(function(){ return {}; }).then(function(j){
          throw new Error(j.detail || j.error || (r.status + " " + r.statusText));
        });
      }
      return r.json();
    }, function(err){
      setNet(false);                      // transport failed: unreachable
      throw err;
    });
  }

  // The wall is sent previews, not bodies, so the SERVER does the matching --
  // see /api/notes. Searching the preview here would miss hits inside long
  // notes and look like "no results".
  var searchT = null, searchSeq = 0;

  function refresh(){
    var mine = ++searchSeq;
    var url = "/api/notes" + (q ? "?q=" + encodeURIComponent(q) : "");
    return api("GET", url).then(function(d){
      if (mine !== searchSeq) return;   // a newer keystroke already won
      NOTES = d.notes;
      if (d.cats) CATS = d.cats;        // full census, never filtered by q
      if (d.authors) AUTHORS = d.authors;
      ME = d.me || null;                // the server read it from the cookie
      shownCount = PAGE; render();
    });
  }

  function search(){
    clearTimeout(searchT);
    searchT = setTimeout(function(){
      refresh().catch(function(e){ fail("Search failed", e); });
    }, 160);
  }

  // One note's real body, for the editor and for any write that rewrites it.
  function fullBody(id){
    return api("GET", "/api/note?id=" + encodeURIComponent(id)).then(function(n){ return n.body; });
  }

  function fail(what, e){
    console.error(what, e);
    toast(what + " — " + ((e && e.message) || "unknown error"), null);
  }

  // Optimistic: apply locally, then persist. On failure say so and reload the
  // truth rather than leaving the screen disagreeing with the disk.
  function persist(n, patch, what){
    var before = {};
    for (var k in patch) { before[k] = n[k]; n[k] = patch[k]; }
    render();
    var req = {id:n.id};
    for (var k2 in patch) req[k2] = patch[k2];
    return api("PUT", "/api/notes", req).then(function(saved){
      for (var k3 in saved) n[k3] = saved[k3];
      render();
      return saved;
    }).catch(function(e){
      for (var k4 in before) n[k4] = before[k4];
      fail(what, e); refresh();
      throw e;
    });
  }

  // Default to Chris's own notes. The agent has written into this space for
  // months, and on first open the wall was almost entirely agent pages — his
  // actual notes were buried (Chris, 2026-11-09).
  var q = "", showArch = false, openId = null, who = "mine";
  var el = {
    q:document.getElementById("q"), chips:document.getElementById("chips"),
    who:document.getElementById("who"), sug:document.getElementById("sug"),
    meBtn:document.getElementById("meBtn"), whobar:document.getElementById("whobar"),
    edCat:document.getElementById("edCat"), catpop:document.getElementById("catpop"),
    edCatBtn:document.getElementById("edCatBtn"), edCatNow:document.getElementById("edCatNow"),
    catlistBox:document.getElementById("catlistBox"), net:document.getElementById("net"),
    wall:document.getElementById("wall"), count:document.getElementById("count"),
    archBtn:document.getElementById("archBtn"), scrim:document.getElementById("scrim"),
    edClose:document.getElementById("edClose"), edTitle:document.getElementById("edTitle"),
    edPin:document.getElementById("edPin"), edScroll:document.getElementById("edScroll"),
    edPath:document.getElementById("edPath"), edCheck:document.getElementById("edCheck"),
    edRaw:document.getElementById("edRaw"), edArch:document.getElementById("edArch"),
    edDel:document.getElementById("edDel"), edSaved:document.getElementById("edSaved"),
    toast:document.getElementById("toast"), toastMsg:document.getElementById("toastMsg"),
    toastUndo:document.getElementById("toastUndo"), newBtn:document.getElementById("newBtn")
  };
  el.q.placeholder = "Search notes";

  function matches(n){
    if (!inScope(n, who)) return false;
    if (!!n.archived !== showArch) return false;
    return true;   // text AND category matching happen server-side
  }

  var INL = /\*\*([^*]+)\*\*|`([^`]+)`|\[\[([^\]|]+?)(?:\|([^\]]+))?\]\]|\[([^\]]+)\]\(([^)]+)\)/g;
  function inline(text, parent){
    var last = 0, m;
    INL.lastIndex = 0;
    while ((m = INL.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1] !== undefined) parent.appendChild(node("strong", null, m[1]));
      else if (m[2] !== undefined) parent.appendChild(node("code", null, m[2]));
      else if (m[3] !== undefined) parent.appendChild(document.createTextNode(m[4] !== undefined ? m[4] : m[3]));
      else parent.appendChild(document.createTextNode(m[5]));
      last = INL.lastIndex;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
    return parent;
  }

  // ---- search term highlighting ----
  // Runs over a finished subtree rather than during construction, so it
  // composes with the markdown renderer: bold, code and link text all get
  // highlighted without inline() needing to know about search at all.
  function terms(){
    // cat: tokens are filters, not text to look for — highlighting them would
    // paint nothing and look broken.
    var t = (q || "").toLowerCase().split(/\s+/).filter(function(x){
      return x && x.indexOf("cat:") !== 0;
    });
    // longest first, so "food lion" marks the longer run before its pieces
    return t.sort(function(a, b){ return b.length - a.length; });
  }

  function highlight(root){
    var ts = terms();
    if (!ts.length || !root) return root;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var texts = [], n;
    while ((n = walker.nextNode())) texts.push(n);
    texts.forEach(function(tn){
      var s = tn.nodeValue, low = s.toLowerCase(), out = null, i = 0;
      while (i < s.length) {
        var at = -1, len = 0;
        for (var k = 0; k < ts.length; k++) {
          var p = low.indexOf(ts[k], i);
          if (p >= 0 && (at < 0 || p < at || (p === at && ts[k].length > len))) { at = p; len = ts[k].length; }
        }
        if (at < 0) break;
        out = out || document.createDocumentFragment();
        if (at > i) out.appendChild(document.createTextNode(s.slice(i, at)));
        var m = document.createElement("mark");
        m.textContent = s.slice(at, at + len);
        out.appendChild(m);
        i = at + len;
      }
      if (out) {
        if (i < s.length) out.appendChild(document.createTextNode(s.slice(i)));
        tn.parentNode.replaceChild(out, tn);
      }
    });
    return root;
  }

  function node(tag, cls, text){
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (text !== undefined) d.textContent = text;
    return d;
  }

  // --- markdown-lite preview: checkboxes, bullets, headings, prose ---
  function renderBody(n, box){
    var lines = (n.preview !== undefined ? n.preview : n.body).split("\n"), para = [], nLines = 0;
    function flush(){
      if (!para.length) return;
      box.appendChild(inline(para.join("\n"), node("p", null)));
      para = [];
    }
    lines.forEach(function(line, i){
      var m;
      if (/^\s*$/.test(line)) { flush(); return; }
      nLines++;
      if ((m = line.match(/^\s*[-*]\s+\[([ xX])\]\s*(.*)$/))) {
        flush();
        var done = m[1].toLowerCase() === "x";
        var row = node("div", "ck" + (done ? " done" : ""));
        var b = node("button", "box" + (done ? " on" : ""));
        b.setAttribute("aria-label", (done ? "Uncheck " : "Check ") + m[2]);
        b.innerHTML = done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m5 13 4.5 4.5L19 7"/></svg>' : "";
        b.addEventListener("click", function(ev){ ev.stopPropagation(); toggleCheck(n, i); });
        row.appendChild(b); row.appendChild(inline(m[2], node("span", null)));
        box.appendChild(row);
      } else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        flush();
        var li = node("div", "li");
        li.appendChild(inline(m[1], node("span", null)));
        box.appendChild(li);
      } else if ((m = line.match(/^#{1,4}\s+(.*)$/))) {
        flush(); box.appendChild(inline(m[1], node("div", "h")));
      } else {
        para.push(line.replace(/^\s*\*(.+)\*\s*$/, "$1"));
      }
    });
    flush();
    return nLines;
  }

  // A card shows a PREVIEW. Toggling from the card must rewrite the whole
  // file, so fetch the real body first -- writing back the preview would
  // silently truncate the note to its first 700 characters.
  // The preview starts at byte 0, so the line index is the same in both.
  function toggleCheck(n, idx){
    fullBody(n.id).then(function(body){
      var lines = body.split("\n");
      if (!/\[([ xX])\]/.test(lines[idx] || "")) throw new Error("that line moved — reopen the note");
      lines[idx] = lines[idx].replace(/\[([ xX])\]/, function(_, c){ return c.toLowerCase() === "x" ? "[ ]" : "[x]"; });
      return api("PUT", "/api/notes", {id:n.id, body:lines.join("\n")});
    }).then(function(saved){
      for (var k in saved) n[k] = saved[k];
      render();
    }).catch(function(e){ fail("Couldn't tick that off", e); refresh(); });
  }

  function card(n){
    var c = node("div", "card" + (n.pinned ? " pinned" : "") + (n.pending ? " pending" : ""));
    c.tabIndex = 0;
    c.appendChild(highlight(node("h3", null, n.title)));

    var pin = node("button", "pin");
    pin.setAttribute("aria-label", (n.pinned ? "Unpin " : "Pin ") + n.title);
    pin.setAttribute("title", n.pinned ? "Unpin" : "Pin");
    pin.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (n.pinned ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 17v5M7 4h10l-1.5 7 2.5 3H5.5L8 11z"/></svg>';
    pin.addEventListener("click", function(ev){ ev.stopPropagation(); persist(n, {pinned:!n.pinned}, "Couldn't pin that").catch(function(){}); });
    c.appendChild(pin);

    var box = node("div", "body");
    var nLines = renderBody(n, box);
    highlight(box);
    c.appendChild(box);

    var meta = node("div", "meta");
    meta.appendChild(node("span", "cat", n.pending ? "queued" : n.cat));
    // Say who wrote it only when that is not you — otherwise every card on
    // your own wall carries your own name, which is noise.
    if (!n.pending && n.author !== meName()) meta.appendChild(node("span", "by", n.author));
    meta.appendChild(node("span", "sp"));
    meta.appendChild(node("span", "yr", n.date));
    c.appendChild(meta);

    function act(){
      if (n.pending) { toast("Queued — this note saves when the box is reachable", null); return; }
      open(n.id);
    }
    c.addEventListener("click", act);
    c.addEventListener("keydown", function(ev){ if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); } });

    // Truncation marker decided from the CONTENT, not from layout. This used
    // to be a per-card requestAnimationFrame that read scrollHeight and then
    // inserted a node -- read, write, read, write, 545 times -- which is
    // layout thrash and was a large part of why the wall felt slow.
    if (n.truncated || nLines > CLIP_LINES) {
      box.classList.add("clipped");
      c.insertBefore(node("div", "more", n.lines + " lines — tap to open"), meta);
    }
    return c;
  }

  function columnCount(){
    var w = el.wall.clientWidth || window.innerWidth || 1280;
    if (w < 560) return 1;
    if (w < 860) return 2;
    if (w < 1180) return 3;
    return 4;
  }

  // Deal round-robin: card i goes to column i % cols. That makes the FIRST ROW
  // the newest cards reading left to right. CSS multicol filled each column
  // top to bottom instead, so column 3 held 2016 notes next to 2026 ones.
  function section(label, items, brass){
    var s = node("div", "section");
    s.appendChild(node("div", "eyebrow" + (brass ? " brass" : ""), label));
    var w = node("div", "wall");
    var cols = columnCount(), boxes = [];
    for (var i = 0; i < cols; i++) { boxes.push(node("div", "col")); w.appendChild(boxes[i]); }
    items.forEach(function(n, i){ boxes[i % cols].appendChild(card(n)); });
    s.appendChild(w);
    return s;
  }

  // Build the wall a page at a time and grow it as you scroll. Rendering all
  // 545 cards up front was ~12,600 DOM nodes, and every keystroke rebuilt the
  // lot: 67 ms per character on a desktop over loopback, far worse on a phone.
  var PAGE = 60, CLIP_LINES = 9, shownCount = PAGE, io = null;

  // Queued notes render as real cards, marked, so a captured thought is
  // visibly on the wall rather than sitting invisibly in a database.
  function pendingCards(){
    return PENDING.map(function(p){
      return {
        id: "pending:" + p.key, title: p.title, preview: p.body,
        lines: p.body.split("\n").filter(function(l){ return l.trim(); }).length,
        truncated: p.body.length > 700, cat: "inbox", author: "chris",
        date: new Date(p.at).toISOString().slice(0, 10),
        pinned: false, archived: false, pending: true
      };
    });
  }

  function render(){
    var shown = pendingCards().concat(NOTES).filter(matches);
    // With a query the server returns them RANKED; re-sorting by date here
    // would throw that away and bury the best match.
    if (!q) shown.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var pinned = shown.filter(function(n){ return n.pinned; });
    var rest = shown.filter(function(n){ return !n.pinned; });

    // Pinned always render in full -- there are a handful, and they are the
    // ones you came for. The page budget applies to everything else.
    var budget = Math.max(0, shownCount - pinned.length);
    var slice = rest.slice(0, budget);
    var more = rest.length - slice.length;

    if (io) { io.disconnect(); io = null; }
    el.wall.textContent = "";
    if (!shown.length) {
      var em = node("div", "empty");
      em.appendChild(node("div", null, showArch ? "Nothing archived yet." : "No notes match " + (q ? '"' + q + '"' : "that filter") + "."));
      el.wall.appendChild(em);
    } else {
      if (pinned.length) el.wall.appendChild(section("Pinned", pinned, true));
      if (slice.length) el.wall.appendChild(section(
        showArch ? "Archived"
          : q ? shown.length + " matching"
          : pinned.length ? "Everything else" : "All notes", slice, false));
      if (more > 0) el.wall.appendChild(sentinel(more));
    }
    el.count.textContent = shown.length === NOTES.length
      ? NOTES.length + " notes"
      : shown.length + " / " + NOTES.length;
    chips();
    drawWho();
  }

  // Grows the wall when it scrolls into view; also a real button, so the page
  // still works if IntersectionObserver is unavailable or never fires.
  function sentinel(more){
    var b = node("button", "more-btn", "Show " + Math.min(PAGE, more) + " more  (" + more + " left)");
    b.addEventListener("click", function(){ shownCount += PAGE; render(); });
    if (window.IntersectionObserver) {
      io = new IntersectionObserver(function(es){
        if (es.some(function(e){ return e.isIntersecting; })) { shownCount += PAGE; render(); }
      }, {rootMargin: "600px"});
      io.observe(b);
    }
    return b;
  }

  // ---- search suggestions: categories AND note titles ----
  // Categories come from the full census so they stay suggestible while the
  // typed text is narrowing the notes; titles come from whatever the server
  // last matched.
  function closeSug(){
    el.sug.hidden = true;
    el.q.setAttribute("aria-expanded", "false");
  }

  function suggest(){
    var t = el.q.value.trim().toLowerCase();
    el.sug.textContent = "";
    if (!t) { closeSug(); return; }

    var cats = Object.keys(CATS).filter(function(c){ return c.indexOf(t) >= 0; })
      .sort(function(a, b){ return CATS[b] - CATS[a]; }).slice(0, 5);
    var titles = NOTES.filter(function(n){ return n.title.toLowerCase().indexOf(t) >= 0; }).slice(0, 6);
    var anyPerson = Object.keys(AUTHORS).some(function(a){ return a.indexOf(t) >= 0; });
    if (!cats.length && !titles.length && !anyPerson) { closeSug(); return; }

    if (cats.length) {
      el.sug.appendChild(node("div", "sug-head", "Categories — filters with cat:"));
      cats.forEach(function(c){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "tag", c.replace(/-/g, " "))));
        b.appendChild(node("span", "n", CATS[c]));
        b.addEventListener("click", function(){ setCat(c); el.q.focus(); });
        el.sug.appendChild(b);
      });
    }
    var people = Object.keys(AUTHORS).filter(function(a){ return a.indexOf(t) >= 0; }).slice(0, 4);
    if (people.length) {
      el.sug.appendChild(node("div", "sug-head", "People — filters with by:"));
      people.forEach(function(p){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "tag", p)));
        b.appendChild(node("span", "n", AUTHORS[p]));
        b.addEventListener("click", function(){
          var rest = (q || "").split(/\s+/).filter(function(x){
            return x && x.toLowerCase().indexOf("by:") !== 0;
          });
          rest.unshift("by:" + p);
          q = rest.join(" "); el.q.value = q + " "; closeSug(); el.q.focus();
          refresh().catch(function(e){ fail("Couldn't filter", e); });
        });
        el.sug.appendChild(b);
      });
    }
    if (titles.length) {
      el.sug.appendChild(node("div", "sug-head", "Notes"));
      titles.forEach(function(n){
        var b = node("button");
        b.setAttribute("role", "option");
        b.appendChild(highlight(node("span", "t", n.title)));
        b.appendChild(node("span", "n", n.date));
        b.addEventListener("click", function(){ closeSug(); open(n.id); });
        el.sug.appendChild(b);
      });
    }
    el.sug.hidden = false;
    el.q.setAttribute("aria-expanded", "true");
  }

  // ---- category chooser ----
  // Lists what exists AND takes a new name, because a chooser that can only
  // pick from a fixed list is how taxonomies ossify.
  function closeCatPop(){
    el.catpop.hidden = true;
    el.edCatBtn.setAttribute("aria-expanded", "false");
  }

  function drawCatList(){
    var typed = el.edCat.value.trim().toLowerCase();
    var now = (ed && ed.note && ed.note.cat) || "";
    el.catlistBox.textContent = "";

    function row(label, value, count, isNew){
      var b = node("button", isNew ? "new" : null);
      b.setAttribute("aria-pressed", value === now ? "true" : "false");
      b.appendChild(document.createTextNode(label));
      if (count !== null) b.appendChild(node("span", "n", count));
      b.addEventListener("click", function(){ setCategory(value); });
      return b;
    }

    var keys = Object.keys(CATS).filter(function(c){ return !typed || c.indexOf(typed) >= 0; })
      .sort(function(a, b){ return CATS[b] - CATS[a] || (a < b ? -1 : 1); });
    var slug = typed.replace(/[^a-z0-9 _-]+/g, "").trim().replace(/\s+/g, "-");
    if (slug && keys.indexOf(slug) < 0) el.catlistBox.appendChild(row("+ " + slug, slug, null, true));
    keys.forEach(function(c){ el.catlistBox.appendChild(row(c.replace(/-/g, " "), c, CATS[c], false)); });
    if (now) el.catlistBox.appendChild(row("— none —", "", null, false));
    if (!el.catlistBox.children.length) el.catlistBox.appendChild(node("div", "sug-head", "no match — type to create"));
  }

  function setCategory(value){
    if (!ed || !ed.note) return;
    closeCatPop();
    if (value === (ed.note.cat || "")) return;
    var n = ed.note;
    persist(n, {category:value}, "Couldn't set the category").then(function(){
      el.edCatNow.textContent = n.cat || "none";
      return refresh();                 // the census changed
    }).catch(function(){});
  }

  // "Mine" needs to know who you are. Without a device identity everyone is
  // Chris, which is exactly what the 545 notes predating this assume.
  function meName(){ return ME || "chris"; }

  function inScope(n, scope){
    if (scope === "claude") return n.author === "claude";
    if (scope === "ours") return n.author !== "claude";
    return n.author === meName();                  // "mine"
  }

  function drawWho(){
    var opts = [["mine", "Mine"], ["ours", "Ours"], ["claude", "Claude"]];
    el.who.textContent = "";
    opts.forEach(function(o){
      var n = NOTES.filter(function(x){ return inScope(x, o[0]); }).length;
      var b = node("button", null, o[1]);
      b.setAttribute("aria-pressed", who === o[0] ? "true" : "false");
      b.setAttribute("title", n + (n === 1 ? " note" : " notes"));
      b.addEventListener("click", function(){ who = o[0]; render(); });
      el.who.appendChild(b);
    });
    drawMe();
  }

  // ---- who is on this device ----
  // A cookie, not an account. Chris: "I don't want to set up auth or accounts
  // really... There's no secrets here to protect." It replaces Keep's
  // add-collaborator dance; the server reads the same cookie when stamping a
  // new note, so attribution does not depend on the client asking nicely.
  function setMe(name){
    var v = (name || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32);
    if (!v) return;
    try {
      document.cookie = "notes_who=" + v + "; path=/; max-age=" + (10 * 365 * 24 * 3600) + "; SameSite=Lax";
    } catch (e) {}
    ME = v;
    el.whobar.hidden = true;
    refresh().catch(function(){});
  }

  function drawMe(){
    el.meBtn.textContent = ME ? ME.charAt(0).toUpperCase() : "?";
    el.meBtn.className = "me-btn" + (ME ? "" : " unset");
    el.meBtn.title = ME ? ("This device is " + ME + " — tap to change") : "Who's using this device?";
  }

  function openWhoBar(){
    el.whobar.textContent = "";
    el.whobar.appendChild(node("span", null, "Who's using this device?"));
    // Offer whoever already writes here, so the second person appears on the
    // first device that names them rather than being hardcoded.
    var names = Object.keys(AUTHORS).filter(function(a){ return a !== "claude"; });
    if (names.indexOf("chris") < 0) names.unshift("chris");
    names.forEach(function(nm){
      var b = node("button", null, nm);
      b.addEventListener("click", function(){ setMe(nm); });
      el.whobar.appendChild(b);
    });
    var other = node("button", null, "someone else…");
    other.addEventListener("click", function(){
      var nm = window.prompt("First name (lowercase, no spaces):", "");
      if (nm) setMe(nm);
    });
    el.whobar.appendChild(other);
    el.whobar.hidden = false;
  }

  el.meBtn.addEventListener("click", openWhoBar);

  // The ONE way to filter by category is the cat: token in the search box.
  // A chip writes that token rather than flipping hidden state, so the chip
  // and the typed syntax are the same mechanism and clicking one teaches the
  // other. There is no separate filter variable to drift out of sync.
  function activeCat(){
    var m = (q || "").toLowerCase().match(/(?:^|\s)cat:(\S+)/);
    return m ? m[1] : "";
  }

  function setCat(value){
    // Keep any ordinary search terms; swap only the cat: token.
    var rest = (q || "").split(/\s+/).filter(function(t){
      return t && t.toLowerCase().indexOf("cat:") !== 0;
    });
    if (value) rest.unshift("cat:" + value);
    q = rest.join(" ");
    el.q.value = q ? q + " " : "";
    closeSug();
    refresh().catch(function(e){ fail("Couldn't filter", e); });
  }

  function chips(){
    // Counts come from the server's full census, not from NOTES — once a
    // cat: filter is applied NOTES holds only that category, and chips built
    // from it would collapse to a single entry.
    var counts = CATS, active = activeCat();
    var keys = Object.keys(counts).sort(function(a, b){
      return counts[b] - counts[a] || (a < b ? -1 : 1);
    });
    // Measure the viewport, not el.chips: the chip row is content-sized, so
    // its own clientWidth is whatever the LAST render put in it — a feedback
    // loop that settles on two chips no matter how wide the window is.
    var avail = (window.innerWidth || 900) - 300;   // brand + the Mine/Claude/Both control
    var room = Math.max(2, Math.floor(avail / 150));
    if (active && keys.indexOf(active) >= room) {       // keep the active one visible
      keys.splice(room - 1, 0, keys.splice(keys.indexOf(active), 1)[0]);
    }
    keys = keys.slice(0, room);

    var total = 0;
    Object.keys(counts).forEach(function(k){ total += counts[k]; });

    el.chips.textContent = "";
    function mk(label, value, n){
      var b = node("button", "chip");
      b.setAttribute("aria-pressed", active === value ? "true" : "false");
      b.appendChild(document.createTextNode(label));
      b.appendChild(node("b", null, n));
      b.addEventListener("click", function(){ setCat(active === value ? "" : value); });
      return b;
    }
    el.chips.appendChild(mk("All", "", total));
    keys.forEach(function(k){ el.chips.appendChild(mk(k.replace(/-/g, " "), k, counts[k])); });
  }

  // --- editor: the card, expanded ---
  // Blocks are the editing unit. One row per line, uniform: Enter makes the next
  // row, Backspace on an empty row removes it. Nothing here needs markdown typed.
  var ed = null, saveT = null, focusIdx = -1, focusEnd = false;

  function parseBlocks(body){
    var out = [];
    body.split("\n").forEach(function(line){
      var m;
      if (/^\s*$/.test(line)) return;
      if ((m = line.match(/^#{1,4}\s+(.*)$/))) out.push({t:"sec", x:m[1]});
      else if ((m = line.match(/^\s*[-*]\s+\[([ xX])\]\s*(.*)$/))) out.push({t:"item", ck:true, done:m[1].toLowerCase() === "x", x:m[2]});
      else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) out.push({t:"item", ck:false, done:false, x:m[1]});
      else if ((m = line.match(/^\*(?!\*)(.+)\*\s*$/))) out.push({t:"note", x:m[1]});
      else out.push({t:"text", x:line});
    });
    if (!out.length) out.push({t:"text", x:""});
    return out;
  }

  function serialize(blocks){
    var lines = [];
    blocks.forEach(function(b, i){
      if (b.t === "sec") { if (i) lines.push(""); lines.push("## " + b.x); }
      else if (b.t === "item" && b.ck) lines.push("- [" + (b.done ? "x" : " ") + "] " + b.x);
      else if (b.t === "item") lines.push("- " + b.x);
      else if (b.t === "note") lines.push("*" + b.x + "*");
      else lines.push(b.x);
    });
    return lines.join("\n");
  }

  function bodyNow(){ return ed.raw !== null ? ed.raw : serialize(ed.blocks); }
  function anyCk(){ return ed.blocks.some(function(b){ return b.t === "item" && b.ck; }); }

  // a section run is the stretch of rows between two headings
  function runOf(i){
    var s = i, e = i, B = ed.blocks;
    while (s > 0 && B[s - 1].t !== "sec") s--;
    while (e < B.length - 1 && B[e + 1].t !== "sec") e++;
    return [s, e];
  }
  function sink(i){                       // checked -> bottom of its own section
    var b = ed.blocks.splice(i, 1)[0], r = runOf(i);
    ed.blocks.splice(r[1], 0, b);
  }
  function raise(i){                      // unchecked -> above the checked ones
    var B = ed.blocks, b = B.splice(i, 1)[0], r = runOf(i), at = r[1] + 1;
    for (var k = r[0]; k <= r[1]; k++) { if (B[k] && B[k].t === "item" && B[k].done) { at = k; break; } }
    B.splice(at, 0, b);
  }

  function touch(){
    clearTimeout(saveT);
    el.edSaved.textContent = "";
    saveT = setTimeout(commit, 350);
  }
  function commit(){
    // Never write while the real body is still in flight: bodyNow() would be
    // the empty placeholder and would overwrite the note with nothing.
    if (!ed || ed.busy || ed.loading) return Promise.resolve();
    var t = el.edTitle.value.trim(), b = bodyNow();
    if (ed.note && t === ed.note.title && b === ed.base) return Promise.resolve();
    if (!ed.id && !t && !b.trim()) return Promise.resolve();   // nothing typed yet
    ed.busy = true;
    var p = ed.id
      ? api("PUT", "/api/notes", {id:ed.id, title:t || "Untitled", body:b})
      : api("POST", "/api/notes", {title:t || "Untitled", body:b});
    var mine = ed;
    return p.then(function(saved){
      // A new note gets its real path from the server; adopt it so the next
      // keystroke updates rather than creating a second file.
      if (mine === ed) { ed.id = saved.id; ed.note = saved; el.edPath.textContent = saved.id; }
      var ex = null;
      for (var i = 0; i < NOTES.length; i++) if (NOTES[i].id === saved.id) ex = NOTES[i];
      if (ex) { for (var k in saved) ex[k] = saved[k]; } else { NOTES.push(saved); }
      el.edSaved.textContent = "Saved";
    }).catch(function(e){
      // A NEW note with nowhere to go is queued rather than lost. An edit is
      // not: replaying it later could overwrite someone else's change.
      if (!mine.id && !ONLINE) {
        return enqueue(t || "Untitled", b, mine.queueKey).then(function(k){
          mine.queueKey = k;
          if (mine === ed) el.edSaved.textContent = "Queued — saves when online";
          render();
        });
      }
      el.edSaved.textContent = "Not saved";
      fail("Couldn't save that note", e);
    }).then(function(){ if (mine === ed) ed.busy = false; });
  }

  function mkRow(b, i){
    var row = node("div", "row" + (b.t === "sec" ? " sec" : "") + (b.t === "note" ? " note" : "") + (b.done ? " done" : ""));

    if (b.t === "item" && b.ck) {
      var cb = node("button", "box" + (b.done ? " on" : ""));
      cb.setAttribute("aria-label", (b.done ? "Uncheck " : "Check ") + b.x);
      cb.innerHTML = b.done ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="m5 13 4.5 4.5L19 7"/></svg>' : "";
      cb.addEventListener("click", function(){
        b.done = !b.done;
        if (b.done) sink(i); else raise(i);
        focusIdx = -1; draw(); touch();
      });
      row.appendChild(cb);
    } else if (b.t === "item") {
      row.appendChild(node("div", "grip", "•"));
    } else {
      row.appendChild(node("div", "grip", ""));
    }

    var inp = document.createElement("textarea");
    inp.className = "it"; inp.rows = 1; inp.value = b.x; inp.spellcheck = false;
    function grow(){ inp.style.height = "auto"; inp.style.height = inp.scrollHeight + "px"; }
    inp._grow = grow;
    inp.setAttribute("aria-label", b.t === "sec" ? "Section name" : "Note line");
    inp.addEventListener("input", function(){ b.x = inp.value; grow(); touch(); });
    inp.addEventListener("keydown", function(ev){
      if (ev.key === "Enter") {
        ev.preventDefault();
        var nb = b.t === "sec" ? {t:"text", x:""} : {t:b.t, ck:b.ck, done:false, x:""};
        ed.blocks.splice(i + 1, 0, nb);
        focusIdx = i + 1; focusEnd = false; draw(); touch();
      } else if (ev.key === "Backspace" && inp.value === "" && ed.blocks.length > 1) {
        ev.preventDefault();
        ed.blocks.splice(i, 1);
        focusIdx = Math.max(0, i - 1); focusEnd = true; draw(); touch();
      } else if (ev.key === "ArrowUp" && i > 0) {
        ev.preventDefault(); focusIdx = i - 1; focusEnd = true; focusRow();
      } else if (ev.key === "ArrowDown" && i < ed.blocks.length - 1) {
        ev.preventDefault(); focusIdx = i + 1; focusEnd = true; focusRow();
      }
    });
    row.appendChild(inp);

    var x = node("button", "x");
    x.setAttribute("aria-label", "Delete line");
    x.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    x.addEventListener("click", function(){
      ed.blocks.splice(i, 1);
      if (!ed.blocks.length) ed.blocks.push({t:"text", x:""});
      focusIdx = -1; draw(); touch();
    });
    row.appendChild(x);
    return row;
  }

  function focusRow(){
    if (focusIdx < 0) return;
    var ins = el.edScroll.querySelectorAll(".it");
    var t = ins[Math.min(focusIdx, ins.length - 1)];
    if (!t) return;
    t.focus();
    if (focusEnd) t.setSelectionRange(t.value.length, t.value.length);
  }

  // one "+" per section, so an item lands under Walmart instead of at the bottom
  function mkAdd(at){
    while (at > 0 && ed.blocks[at - 1] && ed.blocks[at - 1].t === "item" && ed.blocks[at - 1].done) at--;
    var add = node("button", "add");
    add.appendChild(node("span", "grip", "+"));
    add.appendChild(document.createTextNode(anyCk() ? "List item" : "Line"));
    add.addEventListener("click", function(){
      ed.blocks.splice(at, 0, anyCk() ? {t:"item", ck:true, done:false, x:""} : {t:"text", x:""});
      focusIdx = at; focusEnd = false; draw(); touch();
    });
    return add;
  }

  function draw(){
    el.edScroll.textContent = "";
    if (ed.raw !== null) {
      var ta = document.createElement("textarea");
      ta.className = "ed-raw"; ta.value = ed.raw; ta.spellcheck = false;
      ta.setAttribute("aria-label", "Markdown source");
      ta.addEventListener("input", function(){ ed.raw = ta.value; touch(); });
      el.edScroll.appendChild(ta);
      return;
    }
    ed.blocks.forEach(function(b, i){
      el.edScroll.appendChild(mkRow(b, i));
      var nx = ed.blocks[i + 1];
      if (!nx || nx.t === "sec") el.edScroll.appendChild(mkAdd(i + 1));
    });
    var ta = el.edScroll.querySelectorAll(".it");
    for (var k = 0; k < ta.length; k++) { if (ta[k]._grow) ta[k]._grow(); }
    focusRow(); focusIdx = -1; focusEnd = false;
  }

  function syncBar(){
    el.edCheck.setAttribute("aria-pressed", ed.raw === null && anyCk() ? "true" : "false");
    el.edRaw.setAttribute("aria-pressed", ed.raw !== null ? "true" : "false");
    el.edPin.setAttribute("aria-pressed", ed.note && ed.note.pinned ? "true" : "false");
    el.edCheck.disabled = ed.raw !== null;
    // The archive button shows the note's STATE, not just an action: lit when
    // the note is archived, and the tooltip then offers the way out.
    var arch = !!(ed.note && ed.note.archived);
    el.edArch.setAttribute("aria-pressed", arch ? "true" : "false");
    el.edArch.setAttribute("aria-label", arch ? "Unarchive note" : "Archive note");
    el.edArch.setAttribute("title", arch ? "Unarchive" : "Archive");
  }

  function open(id){
    var n = null;
    for (var i = 0; i < NOTES.length; i++) if (NOTES[i].id === id) n = NOTES[i];
    // The wall holds previews, so the editor fetches the real body. Until it
    // lands the note is NOT editable -- typing into a preview and saving it
    // would truncate the file.
    ed = {id:id || null, note:n, base:"", busy:false, loading:!!n, blocks:parseBlocks(""), raw:null};
    el.edTitle.value = n ? n.title : "";
    el.edPath.textContent = n ? n.id : "Inbox/" + new Date().toISOString().slice(0, 10) + "-new-note.md";
    el.edSaved.textContent = n ? "Edited " + n.date : "";
    el.edCat.value = "";
    el.edCatNow.textContent = n ? (n.cat || "none") : "";
    el.edCatBtn.disabled = !n;       // a new note gets its category on first save
    closeCatPop();
    el.scrim.hidden = false;
    syncBar();
    if (!n) { draw(); el.edTitle.focus(); return; }

    el.edScroll.textContent = "";
    el.edScroll.appendChild(node("div", "empty", "Loading…"));
    var mine = ed;
    fullBody(id).then(function(body){
      if (mine !== ed) return;              // closed or switched while loading
      ed.base = body; ed.loading = false;
      ed.blocks = parseBlocks(body);
      draw();
    }).catch(function(e){
      if (mine !== ed) return;
      el.edScroll.textContent = "";
      el.edScroll.appendChild(node("div", "empty", "Couldn't load this note — " + ((e && e.message) || "unknown error")));
      fail("Couldn't open that note", e);
    });
  }
  function close(){
    if (!ed) return;
    clearTimeout(saveT);
    commit().then(render);
    ed = null; el.scrim.hidden = true; render();
  }

  el.edTitle.addEventListener("input", touch);

  // Category is its own write — it is frontmatter, not body text, and it
  // should land even if nothing else in the note changed.
  el.edCatBtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    if (!ed || !ed.note) return;
    var opening = el.catpop.hidden;
    el.catpop.hidden = !opening;
    el.edCatBtn.setAttribute("aria-expanded", opening ? "true" : "false");
    if (opening) { el.edCat.value = ""; drawCatList(); el.edCat.focus(); }
  });
  el.edCat.addEventListener("input", drawCatList);
  el.edCat.addEventListener("keydown", function(ev){
    if (ev.key === "Enter") {
      ev.preventDefault();
      var first = el.catlistBox.querySelector("button");
      if (first) first.click();
    } else if (ev.key === "Escape") {
      ev.preventDefault(); ev.stopPropagation(); closeCatPop();
    }
  });
  document.addEventListener("click", function(ev){
    if (!el.catpop.hidden && !el.catpop.contains(ev.target) && ev.target !== el.edCatBtn) closeCatPop();
  });
  el.edClose.addEventListener("click", close);
  el.scrim.addEventListener("click", function(ev){ if (ev.target === el.scrim) close(); });
  document.addEventListener("keydown", function(ev){ if (ev.key === "Escape" && ed) close(); });

  el.edPin.addEventListener("click", function(){
    commit().then(function(){
      if (!ed || !ed.note) return;
      return persist(ed.note, {pinned:!ed.note.pinned}, "Couldn't pin that").then(syncBar);
    }).catch(function(){});
  });

  // Keep's "Show checkboxes", on a corpus that is mostly bare lines
  el.edCheck.addEventListener("click", function(){
    var on = anyCk();
    ed.blocks.forEach(function(b){
      if (b.t === "sec") return;
      if (on) { b.t = "text"; b.ck = false; b.done = false; }
      else { b.t = "item"; b.ck = true; b.done = !!b.done; }
    });
    focusIdx = -1; draw(); syncBar(); touch();
  });

  el.edRaw.addEventListener("click", function(){
    if (ed.raw === null) ed.raw = serialize(ed.blocks);
    else { ed.blocks = parseBlocks(ed.raw); ed.raw = null; }
    focusIdx = -1; draw(); syncBar(); touch();
  });

  el.edArch.addEventListener("click", function(){
    commit().then(function(){
      if (!ed || !ed.note) { close(); return; }
      var n = ed.note, was = !!n.archived;
      close();
      return persist(n, {archived:!was}, "Couldn't archive that").then(function(){
        // Re-read rather than trust the local mutation: the archive view is a
        // different slice of the same list, and a stale entry there shows up
        // as "it isn't in the archive until I refresh".
        return refresh();
      }).then(function(){
        toast(was ? "Unarchived" : "Archived", function(){
          persist(n, {archived:was}, "Couldn't undo that").then(refresh).catch(function(){});
        });
      });
    }).catch(function(){});
  });

  // Delete MOVES the note to Trash/ on the box, so undo restores a real file
  // and a mis-tap is recoverable from the space even after the toast is gone.
  el.edDel.addEventListener("click", function(){
    commit().then(function(){
      if (!ed || !ed.id) { close(); return; }
      var id = ed.id;
      close();
      return api("POST", "/api/notes/trash", {id:id}).then(function(d){
        return refresh().then(function(){
          toast("Note deleted", function(){
            api("POST", "/api/notes/restore", {id:d.trashed})
              .then(refresh)
              .catch(function(e){ fail("Couldn't restore that note", e); });
          });
        });
      });
    }).catch(function(e){ fail("Couldn't delete that note", e); });
  });

  var toastT = null;
  function toast(msg, undo){
    clearTimeout(toastT);
    el.toastMsg.textContent = msg;
    el.toast.hidden = false;
    el.toastUndo.onclick = function(){ undo(); el.toast.hidden = true; };
    toastT = setTimeout(function(){ el.toast.hidden = true; }, 6000);
  }

  el.newBtn.addEventListener("click", function(){ open(null); });
  el.archBtn.addEventListener("click", function(){
    showArch = !showArch;
    el.archBtn.setAttribute("aria-pressed", showArch ? "true" : "false");
    render();
  });
  el.q.addEventListener("input", function(){ q = el.q.value.trim(); suggest(); search(); });
  el.q.addEventListener("focus", suggest);
  el.q.addEventListener("keydown", function(ev){
    if (ev.key === "Escape") { closeSug(); el.q.blur(); }
    else if (ev.key === "ArrowDown") {
      var first = el.sug.querySelector("button");
      if (first) { ev.preventDefault(); first.focus(); }
    }
  });
  document.addEventListener("click", function(ev){
    if (!el.sug.hidden && !el.sug.contains(ev.target) && ev.target !== el.q) closeSug();
  });

  // ---- keyboard ----
  // Ctrl/Cmd-F, -N and -S are taken over deliberately: the browser's own Find
  // only searches the ~60 cards currently in the DOM, which on a 586-note wall
  // is a worse answer than this page's own search, delivered confidently.
  document.addEventListener("keydown", function(ev){
    var mod = ev.ctrlKey || ev.metaKey;
    if (!mod || ev.altKey) return;
    var k = (ev.key || "").toLowerCase();
    if (k === "f") {
      ev.preventDefault();
      el.q.focus(); el.q.select(); suggest();
    } else if (k === "n") {
      ev.preventDefault();
      if (!ed) open(null);
    } else if (k === "s") {
      ev.preventDefault();
      syncNow();
    }
  });

  // Ctrl-S means "flush whatever is pending and re-read", which is the honest
  // meaning of save here: edits already autosave, so the useful work is making
  // sure nothing is in flight and the wall matches the disk.
  function syncNow(){
    var p = ed ? commit() : Promise.resolve();
    p.then(refresh).then(function(){
      setNet(true);
      toast(ed ? "Saved" : "Synced", null);
    }).catch(function(e){ fail("Sync failed", e); });
  }

  // ---- service worker ----
  // Unregister anything that is not ours FIRST. This origin ran SilverBullet's
  // PWA until 2026-11-09 and its worker still owns browsers that opened it —
  // serving a dead shell on every normal refresh. (The server also replies at
  // its old /service_worker.js with a self-destructing worker, because a
  // poisoned browser never gets far enough to run this.)
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) {
        var src = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || "";
        if (src && src.indexOf("/sw.js") < 0) return r.unregister();
      }));
    }).then(function () {
      return navigator.serviceWorker.register("/sw.js", {scope: "/"});
    }).catch(function (e) { console.warn("service worker:", e); });
  }

  // ---- outbox: capture a NEW note with no connection ----
  // Deliberately creates only. A create cannot conflict — the server picks a
  // fresh filename — whereas replaying an EDIT can land on a file that one of
  // the other three writers of this space changed underneath it, and that
  // needs a precondition and a real conflict answer, not a queue.
  var DB = null, PENDING = [];

  function db(){
    if (DB) return Promise.resolve(DB);
    return new Promise(function(res, rej){
      if (!window.indexedDB) { rej(new Error("no indexedDB")); return; }
      var rq = indexedDB.open("notes-outbox", 1);
      rq.onupgradeneeded = function(){ rq.result.createObjectStore("queue", {autoIncrement:true}); };
      rq.onsuccess = function(){ DB = rq.result; res(DB); };
      rq.onerror = function(){ rej(rq.error); };
    });
  }

  function tx(mode, fn){
    return db().then(function(d){
      return new Promise(function(res, rej){
        var t = d.transaction("queue", mode), store = t.objectStore("queue"), out;
        out = fn(store);
        t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function(){ rej(t.error); };
      });
    });
  }

  // An editor session owns ONE queue entry. Without the key, the debounced
  // autosave queues the note and then closing queues it again — the same
  // thought lands twice, which is exactly the failure a capture tool must not
  // have.
  function enqueue(title, body, key){
    var rec = {title:title, body:body, at:Date.now()};
    return tx("readwrite", function(s){
      return key === undefined || key === null ? s.add(rec) : s.put(rec, key);
    }).then(function(k){
      return loadPending().then(function(){ return k; });
    });
  }

  function loadPending(){
    return db().then(function(d){
      return new Promise(function(res, rej){
        var out = [], cur = d.transaction("queue").objectStore("queue").openCursor();
        cur.onsuccess = function(){
          var c = cur.result;
          if (!c) { PENDING = out; res(out); return; }
          out.push({key:c.key, title:c.value.title, body:c.value.body, at:c.value.at});
          c.continue();
        };
        cur.onerror = function(){ rej(cur.error); };
      });
    }).catch(function(){ PENDING = []; return []; });
  }

  var draining = false;
  function drain(){
    if (draining) return Promise.resolve();
    draining = true;
    return loadPending().then(function(items){
      // Oldest first, and stop at the first failure so order is preserved and
      // nothing is dropped on a flaky link.
      return items.reduce(function(chain, it){
        return chain.then(function(ok){
          if (!ok) return false;
          return api("POST", "/api/notes", {title:it.title, body:it.body})
            .then(function(){ return tx("readwrite", function(s){ s.delete(it.key); }); })
            .then(function(){ return true; })
            .catch(function(){ return false; });
        });
      }, Promise.resolve(true));
    }).then(function(){
      return loadPending();
    }).then(function(left){
      draining = false;
      if (left.length === 0) return refresh();
      render();
    }).catch(function(){ draining = false; });
  }

  // ---- online / offline ----
  // navigator.onLine only knows about the link, not whether THIS box is
  // reachable, so a failed request also flips it — and a success flips it back.
  var ONLINE = true;
  function setNet(up){
    if (up === ONLINE) return;
    ONLINE = up;
    el.net.className = "net" + (up ? "" : " off");
    el.net.title = up ? "Online — changes save as you type" : "Offline — changes are NOT being saved";
    el.net.innerHTML = up
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 6.5 19z"/><path d="m9.5 14.5 2 2 3.5-4"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.1 11 3.5 3.5 0 0 0 6.5 19z"/><path d="M3 3l18 18"/></svg>';
  }
  ONLINE = false; setNet(true);                       // paint the initial state
  window.addEventListener("online", function(){ setNet(true); drain(); });
  window.addEventListener("offline", function(){ setNet(false); });

  // Column count is width-derived, so a rotation or a resize has to re-deal.
  var rsT = null;
  window.addEventListener("resize", function(){
    clearTimeout(rsT);
    rsT = setTimeout(function(){ if (!ed) render(); }, 150);
  });

  el.wall.appendChild(node("div", "empty", "Loading notes…"));
  loadPending().then(drain);
  refresh().then(function(){
    // Ask once, on a device that has never said who it is. Everything works
    // without answering — the note is simply attributed to Chris, which is
    // what every note before this was.
    if (!ME) { openWhoBar(); return; }
    // A second person's first visit would otherwise land on an empty wall,
    // because "Mine" is empty until they write something.
    var mine = NOTES.filter(function(n){ return inScope(n, "mine"); }).length;
    if (!mine) { who = "ours"; render(); }
  }).catch(function(e){
    el.wall.textContent = "";
    var em = node("div", "empty");
    em.appendChild(node("div", null, "Couldn't reach the notes service."));
    em.appendChild(node("div", null, (e && e.message) || ""));
    el.wall.appendChild(em);
  });
})();
</script>
</body>
</html>
